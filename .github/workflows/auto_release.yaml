name: Auto Create Release

on:
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Automatically reads the version string from your pyproject.toml
      - name: Parse Version
        id: version_parser
        run: |
          VER=$(grep -m 1 '^version =' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VER" >> $GITHUB_OUTPUT

      # 2. Creates the tag, names it, auto-populates the commits, and handles pre-releases
      - name: Spawn GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.version_parser.outputs.VERSION }}";
            const isPrerelease = version.includes('-'); // Automatically detects alpha/beta/rc
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              generate_release_notes: true, // Pulls descriptions from commits automatically
              prerelease: isPrerelease
            });