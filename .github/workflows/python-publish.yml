name: Build and Publish Python Package

on:
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml' # Triggers automatically when you edit the version

permissions:
  contents: write  # Needed to natively create the GitHub Release
  id-token: write  # MANDATORY for secure Trusted Publishing to PyPI

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Using specific keys forces an AND condition: file path AND regex match
          filters: |
            version:
              - path: 'pyproject.toml'
                grep: '^version ='

  release-and-build:
    runs-on: ubuntu-latest
    needs: check-version-change
    # CRITICAL: This job will ONLY execute if the version line was actually modified!
    if: needs.check-version-change.outputs.version_changed == 'true'
    outputs:
      version: ${{ steps.version_parser.outputs.VERSION }}
      commit_msg: ${{ steps.commit_message.outputs.MSG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Automatically read the version string from pyproject.toml
      - name: Parse Version
        id: version_parser
        run: |
          VER=$(grep -m 1 '^version =' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VER" >> $GITHUB_OUTPUT

      # 2. Extract the exact name of the commit for the description
      - name: Get Commit Message
        id: commit_message
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3. Create the GitHub Release natively using the workflow's built-in token
      - name: Spawn GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.version_parser.outputs.VERSION }}";
            const commitMsg = `${{ steps.commit_message.outputs.MSG }}`;
            const isPrerelease = version.includes('-');
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: commitMsg,
              prerelease: isPrerelease
            });

      # 4. Set up Python environment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 5. Build distributions locally inside the runner
      - name: Build release distributions
        run: |
          python3 -m pip install build
          python3 -m build

      # 6. Upload the built assets to a temporary runner artifact slot
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - check-version-change
      - release-and-build
      # Only publish if the build job successfully ran
    if: needs.check-version-change.outputs.version_changed == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pylcp_gui
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      # 7. Publish securely to TestPyPI using Trusted Publishing (OIDC)
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/